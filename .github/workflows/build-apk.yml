name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 2 -name sdkmanager | head -n1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk moneymanager-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymanager-debug-apk
          path: moneymanager-debug.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新安装包
          body: 自动构建，手机浏览器直接打开下面的 apk 文件下载安装。
          prerelease: true
          files: moneymanager-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
