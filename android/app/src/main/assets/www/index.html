<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Manager">
<meta name="theme-color" content="#F1EAD9">
<title>Money Manager · 支出记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%2320324A'/%3E%3Cpath d='M32,82 L32,30 L54,56 L76,30 L76,82' fill='none' stroke='%23F1EAD9' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' fill='%2320324A'/%3E%3Cpath d='M32,82 L32,30 L54,56 L76,30 L76,82' fill='none' stroke='%23F1EAD9' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1EAD9;
  --paper-2:#E8DEC7;
  --card:#F8F3E6;
  --ink:#20324A;
  --ink-60:#4C5C74;
  --ink-35:#948B76;
  --rule:#D9CDB0;
  --rule-soft:#E6DDC6;
  --stamp:#AA3A2C;
  --moss:#3C6E4A;
  --paper-rgb:241,234,217;
  --ink-rgb:32,50,74;

  --c1:#A24B3E; --c2:#4A4038; --c3:#35507A; --c4:#6B4B70;
  --c5:#2F7A78; --c6:#A67F35; --c7:#3F5E43; --c8:#7A3B4A;
  --c9:#726A54; --c10:#5C6E52; --c11:#7C7669;

  --i1:#3C6E4A; --i2:#6E7A3C; --i3:#2F7A72;
  --i4:#C0603F; --i5:#6E6B4A; --i6:#7A8570;

  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  --serif:'Noto Serif SC','Songti SC','SimSun',var(--sans);

  --pad:20px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
/* ---------- 主题：可爱风粉色 ---------- */
:root[data-theme="pink"]{
  --paper:#FDEEF2;
  --paper-2:#F9DCE6;
  --card:#FFF6F9;
  --ink:#6B3D55;
  --ink-60:#8C5D74;
  --ink-35:#BB92A3;
  --rule:#F0C7D6;
  --rule-soft:#F7DEE8;
  --stamp:#E8598A;
  --moss:#3FA6A0;
  --paper-rgb:253,238,242;
  --ink-rgb:107,61,85;

  --c1:#E86A82; --c2:#A9727E; --c3:#7C93D6; --c4:#B876C7;
  --c5:#4FB6AE; --c6:#E6A15C; --c7:#6FAE7C; --c8:#D65C6E;
  --c9:#BE94A0; --c10:#6FB3D9; --c11:#B7A3AC;

  --i1:#4FB89C; --i2:#8CB86A; --i3:#3FA6A0;
  --i4:#E85C7A; --i5:#9BAE7A; --i6:#7FBFAE;
}
/* ---------- 主题：极简黑白 ---------- */
:root[data-theme="mono"]{
  --paper:#FCFCFA;
  --paper-2:#EFEFEA;
  --card:#F6F6F3;
  --ink:#1A1A18;
  --ink-60:#5C5C56;
  --ink-35:#9C9C94;
  --rule:#E2E2DC;
  --rule-soft:#EDEDE8;
  --stamp:#7A3D3A;
  --moss:#3D5F48;
  --paper-rgb:252,252,250;
  --ink-rgb:26,26,24;

  --c1:#6B5D52; --c2:#4A5259; --c3:#52606B; --c4:#5F5259;
  --c5:#4F615C; --c6:#6B6152; --c7:#5A6152; --c8:#6B5259;
  --c9:#5C5C58; --c10:#525F6B; --c11:#8C8C86;

  --i1:#4A5F4F; --i2:#5C5F47; --i3:#47595C;
  --i4:#6B4A47; --i5:#5C5947; --i6:#59605A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + var(--sab));
  overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- 通用排版 ---------- */
.eyebrow{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-35);
  font-weight:500;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hr{height:1px;background:var(--rule);border:0;margin:0}
.hr-soft{height:1px;background:var(--rule-soft);border:0;margin:0}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:var(--paper);
  padding:calc(var(--sat) + 14px) var(--pad) 0;
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.wordmark{display:flex;align-items:baseline;gap:8px;min-width:0}
.wordmark b{font-family:var(--serif);font-size:15.5px;font-weight:700;letter-spacing:0;white-space:nowrap}
.wordmark span{font-family:var(--mono);font-size:10px;color:var(--ink-35);letter-spacing:.12em}
.review-badge{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  color:var(--stamp);border:1px solid var(--stamp);padding:2px 7px;
}
.topbar-actions{display:flex;gap:8px}
.icon-btn{
  position:relative;
  width:34px;height:34px;border:1px solid var(--rule);border-radius:0;
  display:grid;place-items:center;color:var(--ink-60);
  transition:background .15s,color .15s;
}
.icon-btn:hover,.icon-btn:focus-visible{background:var(--paper-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.icon-btn .dot{
  position:absolute;top:6px;right:6px;
  width:7px;height:7px;border-radius:50%;
  background:var(--stamp);border:1.5px solid var(--paper);
}

/* 周期切换 —— 刻度式 */
.periods{display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.periods button{
  flex:1;padding:11px 4px 10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-35);position:relative;transition:color .15s;
}
.periods button+button{border-left:1px solid var(--rule-soft)}
.periods button[aria-selected="true"]{color:var(--ink)}
.periods button[aria-selected="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--stamp);
}

/* ---------- 主数字 ---------- */
main{padding:0 var(--pad)}
.hero{padding:26px 0 0}
.hero-range{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.nav-arrow{
  font-family:var(--mono);font-size:15px;color:var(--ink-35);
  width:28px;height:28px;display:grid;place-items:center;
}
.nav-arrow:hover{color:var(--ink)}
.nav-arrow[disabled]{opacity:.25;cursor:default}

.total{
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  font-weight:500;
  font-size:clamp(46px,15.5vw,68px);
  line-height:.92;
  letter-spacing:-.035em;
  display:flex;align-items:flex-start;gap:.12em;
  color:var(--ink);
}
.total .yen{font-size:.4em;color:var(--stamp);margin-top:.22em;letter-spacing:0}
.total .cents{font-size:.5em;margin-top:.16em;margin-left:-.06em;color:var(--ink-60);letter-spacing:-.02em}

/* ---------- 收支对比 ---------- */
.io-bars{margin-top:20px;border-top:1px solid var(--rule);padding-top:14px}
.io-bar-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.io-bar-row .io-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-35);width:auto;min-width:32px;flex-shrink:0;white-space:nowrap}
.io-bar-row .io-bar{flex:1;height:9px;background:var(--paper-2);overflow:hidden}
.io-bar-row .io-bar i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.io-bar-row .io-amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:74px;text-align:right}
.io-bar-row.balance{border-top:1px solid var(--rule-soft);margin-top:6px;padding-top:9px;justify-content:flex-end}
.io-bar-row.balance .io-label{width:auto;margin-right:auto}

/* ---------- 签名元素：占比刻度条 / 圆环 ---------- */
.bar-wrap{margin-top:22px}
.comp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.view-toggle{display:flex;border:1px solid var(--rule)}
.view-toggle button{width:27px;height:23px;display:grid;place-items:center;color:var(--ink-35);transition:background .15s,color .15s}
.view-toggle button[hidden]{display:none}
.view-toggle button+button{border-left:1px solid var(--rule-soft)}
.view-toggle button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.view-toggle svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.bar{
  display:flex;height:26px;width:100%;
  background:var(--paper-2);
  overflow:hidden;
}
.bar i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar-ticks{
  display:flex;justify-content:space-between;
  border-top:1px solid var(--rule);
  padding-top:5px;margin-top:0;
}
.bar-ticks span{font-family:var(--mono);font-size:9.5px;color:var(--ink-35);letter-spacing:.06em}

.ring-box{position:relative;display:flex;align-items:center;justify-content:center;padding:6px 0 2px}
.ring-box svg{width:158px;height:158px}
.ring-box circle{transition:stroke-dasharray .5s cubic-bezier(.2,.7,.2,1),stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1)}
.ring-center{position:absolute;text-align:center;pointer-events:none}
.ring-center b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--ink)}
.ring-center span{font-family:var(--mono);font-size:10px;color:var(--ink-35);letter-spacing:.04em}

.trend-box{padding:8px 0 2px}
.trend-box svg{width:100%;height:auto;display:block}
.trend-legend{display:flex;gap:16px;justify-content:center;margin-top:2px}
.trend-legend span{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--ink-35);letter-spacing:.04em}
.trend-legend i{width:8px;height:8px;border-radius:50%;display:block}

/* ---------- 分类排行 ---------- */
.section{margin-top:34px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.cats{border-top:1px solid var(--rule)}
.cat-row{
  display:grid;grid-template-columns:21px 1fr auto auto;
  align-items:center;gap:11px;
  padding:11px 0;border-bottom:1px solid var(--rule-soft);
}
.seal{
  width:21px;height:21px;border-radius:50%;flex-shrink:0;
  border:1.3px solid currentColor;
  display:flex;align-items:center;justify-content:center;
}
.seal svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seal.sm{width:15px;height:15px;border-width:1.1px}
.seal.sm svg{width:9px;height:9px;stroke-width:2.1}
.cat-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-pct{font-family:var(--mono);font-size:10.5px;color:var(--ink-35);min-width:34px;text-align:right}
.cat-amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;min-width:76px;text-align:right}

/* ---------- 流水 ---------- */
.day-head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:20px 0 7px;
}
.day-head .d{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-60);text-transform:uppercase}
.day-head .s{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink-35)}
.tx-swipe{
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  border-top:1px solid var(--rule-soft);
  animation:rise .3s cubic-bezier(.2,.7,.2,1) both;
}
.tx-swipe::-webkit-scrollbar{display:none}
.tx-swipe-track{display:flex;width:100%}
.tx-content{flex:0 0 100%;scroll-snap-align:start;background:var(--paper);padding-right:14px}
.tx-actions{flex:0 0 104px;scroll-snap-align:start;display:flex}
.tx-act{flex:1;display:flex;align-items:center;justify-content:center;color:var(--paper)}
.tx-act.edit{background:var(--ink-60)}
.tx-act.del{background:var(--stamp)}
.tx-act svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{
  display:grid;grid-template-columns:21px 1fr auto;
  align-items:center;gap:11px;
  padding:12px 0;
}
.tx-main{min-width:0}
.tx-merch{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-meta{display:flex;gap:8px;align-items:center;margin-top:2px}
.tx-meta span{font-family:var(--mono);font-size:10px;color:var(--ink-35);letter-spacing:.04em}
.tx-amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;letter-spacing:-.01em}
.tx-amt.income{color:var(--moss)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.empty{
  border:1px dashed var(--rule);
  padding:30px 22px;text-align:center;margin-top:8px;
}
.empty p{margin:0 0 4px;font-size:14px}
.empty small{color:var(--ink-35);font-size:12px}

.report-row{padding:16px 0;border-bottom:1px solid var(--rule-soft)}
.report-row:first-child{padding-top:0}
.report-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.report-tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--stamp);border:1px solid var(--stamp);padding:2px 6px}
.report-period{font-family:var(--mono);font-size:11px;color:var(--ink-35)}
.report-row .report-text{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-60)}

/* ---------- 底部动作条 ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:26px var(--pad) calc(12px + var(--sab));
  background:linear-gradient(to top,var(--paper) 0,var(--paper) 74%,rgba(var(--paper-rgb),0) 100%);
  display:flex;gap:9px;
}
.dock button{
  flex:1;padding:14px 8px;
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--ink);
  transition:transform .1s;
}
.dock button:active{transform:scale(.985)}
.dock .primary{background:var(--ink);color:var(--paper)}

/* ---------- 抽屉 ---------- */
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(var(--ink-rgb),.32);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--paper);
  border-top:2px solid var(--ink);
  transform:translateY(101%);
  transition:transform .3s cubic-bezier(.2,.75,.2,1);
  max-height:94vh;overflow-y:auto;
  padding:0 var(--pad);
  -webkit-overflow-scrolling:touch;
}
.sheet.on{transform:none}
.sheet-head{
  position:sticky;top:0;background:var(--paper);z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 12px;border-bottom:1px solid var(--rule);margin-bottom:18px;
}
.sheet-head h2{margin:0;font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.01em}
.close{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-35);text-transform:uppercase}
.close:hover{color:var(--ink)}

/* 录入 */
.amount-display{
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;
  font-size:52px;line-height:1;letter-spacing:-.035em;
  text-align:right;padding:6px 0 14px;border-bottom:2px solid var(--ink);
  display:flex;align-items:baseline;justify-content:flex-end;gap:.1em;
}
.amount-display .yen{font-size:.36em;color:var(--stamp)}
.amount-display.zero{color:var(--ink-35)}
.amount-display.income .yen{color:var(--moss)}

.type-toggle{display:flex;border:1px solid var(--rule);margin-bottom:18px}
.type-toggle button{flex:1;padding:10px 4px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-35);position:relative;transition:background .15s,color .15s}
.type-toggle button+button{border-left:1px solid var(--rule-soft)}
.type-toggle button[aria-selected="true"]{color:var(--paper);background:var(--ink)}

.field{margin-top:20px}
.field label{display:block;margin-bottom:7px}
.field input[type=text],.field input[type=datetime-local]{
  width:100%;padding:11px 12px;background:var(--card);
  border:1px solid var(--rule);border-radius:0;
}
.field input:focus{outline:2px solid var(--ink);outline-offset:-2px}

.merchant-row{display:flex;gap:8px}
.merchant-row input[type=text]{width:auto;flex:1;min-width:0}
.cat-pill{
  flex-shrink:0;display:flex;align-items:center;gap:6px;
  padding:0 10px;background:var(--card);
  border:1px solid var(--rule);max-width:38%;
}
.cat-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.cat-pill.guessed{border-color:var(--stamp);border-style:dashed}
.cat-pill-go{width:12px;height:12px;stroke:var(--ink-35);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.cat-field{position:relative}
.cat-pop{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;
  background:var(--paper);border:1px solid var(--rule);
  padding:12px;box-shadow:0 10px 28px rgba(var(--ink-rgb),.18);
  max-height:min(280px,60vh);overflow-y:auto;
}

.time-toggle{
  width:100%;display:flex;align-items:baseline;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--rule-soft);text-align:left;
}
.time-toggle #time-preview{font-family:var(--mono);font-size:13px;color:var(--ink)}
.time-toggle .tt-go{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-35)}
.time-toggle:hover .tt-go{color:var(--ink)}
.time-toggle[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:8px 12px;border:1px solid var(--rule);background:var(--card);
  font-size:12.5px;display:flex;align-items:center;gap:6px;
  transition:background .12s,border-color .12s;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.guessed{border-color:var(--stamp);border-style:dashed}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);margin-top:20px;border:1px solid var(--rule)}
.keypad button{
  background:var(--card);padding:14px 0;
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:500;
  transition:background .1s;
}
.keypad button:active{background:var(--paper-2)}
.keypad button.wide{grid-column:span 1}

.save-wrap{
  position:sticky;bottom:0;z-index:3;
  background:var(--paper);
  padding:12px 0 calc(18px + var(--sab));
  margin-top:18px;
}
.save-wrap::before{
  content:"";position:absolute;left:0;right:0;top:-14px;height:14px;
  background:linear-gradient(to top,var(--paper),rgba(var(--paper-rgb),0));
  pointer-events:none;
}
.save-btn{
  width:100%;padding:16px;
  background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
}
.save-btn[disabled]{opacity:.32}

/* 导入 */
.drop{
  border:1px dashed var(--rule);padding:26px 18px;text-align:center;
  background:var(--card);transition:border-color .15s,background .15s;
}
.drop.hot{border-color:var(--ink);background:var(--paper-2)}
.drop p{margin:0 0 6px;font-size:14px}
.drop small{color:var(--ink-35);font-size:11.5px;display:block;line-height:1.6}
.file-btn{
  display:inline-block;margin-top:14px;padding:10px 20px;border:1px solid var(--ink);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
}
.log{
  margin-top:16px;font-family:var(--mono);font-size:11.5px;line-height:1.85;
  color:var(--ink-60);border-top:1px solid var(--rule);padding-top:12px;
}
.log b{color:var(--ink);font-weight:500}
.log .bad{color:var(--stamp)}
#storage-note{display:block;font-size:9px;color:var(--ink-35);white-space:nowrap;overflow-x:auto}

/* 设置 */
.row-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 0;border-bottom:1px solid var(--rule-soft);text-align:left;
}
.row-btn[hidden]{display:none}
.row-btn small{display:block;color:var(--ink-35);font-size:11.5px;margin-top:2px;line-height:1.5}
.row-btn .go{font-family:var(--mono);font-size:12px;color:var(--ink-35)}
.row-btn:hover .go{color:var(--ink)}
.row-block{padding:15px 0;border-bottom:1px solid var(--rule-soft)}
.row-block>span{display:block;margin-bottom:11px}
.row-block>span small{display:block;color:var(--ink-35);font-size:11.5px;margin-top:2px;line-height:1.5}
.theme-row{display:flex;flex-wrap:wrap;gap:8px}
.theme-chip{
  padding:8px 12px;border:1px solid var(--rule);background:var(--card);
  font-size:12.5px;display:flex;align-items:center;gap:7px;
  transition:background .12s,border-color .12s;
}
.theme-chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.theme-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.code{
  font-family:var(--mono);font-size:11px;background:var(--card);
  border:1px solid var(--rule);padding:11px;margin-top:9px;
  word-break:break-all;line-height:1.7;color:var(--ink-60);
}
.code b{color:var(--stamp);font-weight:500}

/* Toast */
.toast{
  position:fixed;left:var(--pad);right:var(--pad);
  bottom:calc(96px + var(--sab));z-index:70;
  background:var(--ink);color:var(--paper);
  padding:13px 15px;
  display:flex;align-items:center;gap:10px;
  transform:translateY(140%);opacity:0;
  pointer-events:none;
  transition:transform .28s cubic-bezier(.2,.75,.2,1),opacity .28s;
}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast .t-amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500}
.toast .t-txt{font-size:13px;opacity:.82;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .t-undo{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid rgba(var(--paper-rgb),.5);padding-bottom:1px;flex-shrink:0}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (min-width:620px){
  body{max-width:600px;margin:0 auto;border-left:1px solid var(--rule);border-right:1px solid var(--rule);min-height:100vh}
  .dock{max-width:600px;left:50%;transform:translateX(-50%)}
  .sheet{max-width:600px;left:50%;transform:translateX(-50%) translateY(101%)}
  .sheet.on{transform:translateX(-50%)}
  .toast{max-width:560px;left:50%;transform:translateX(-50%) translateY(140%)}
  .toast.on{transform:translateX(-50%);pointer-events:auto}
}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="wordmark"><b>Money Manager</b><span id="wm-count">0 笔</span><button class="review-badge" id="review-badge" hidden></button></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-reports" aria-label="周报与月报小结" data-i18n-aria="reportsAria">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <i class="dot" id="reports-dot" hidden></i>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="设置与备份" data-i18n-aria="settingsAria">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="periods" role="tablist">
    <button role="tab" data-period="day" aria-selected="false" data-i18n="periodDay">本日</button>
    <button role="tab" data-period="week" aria-selected="true" data-i18n="periodWeek">本周</button>
    <button role="tab" data-period="month" aria-selected="false" data-i18n="periodMonth">本月</button>
    <button role="tab" data-period="all" aria-selected="false" data-i18n="periodAll">全部</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-range">
      <span class="eyebrow" id="range-label">—</span>
      <div style="display:flex;gap:2px">
        <button class="nav-arrow" id="nav-prev" aria-label="上一期" data-i18n-aria="prevPeriod">←</button>
        <button class="nav-arrow" id="nav-next" aria-label="下一期" data-i18n-aria="nextPeriod">→</button>
      </div>
    </div>
    <div class="total" id="total"><span class="yen">¥</span><span id="total-int">0</span><span class="cents" id="total-cents">.00</span></div>
    <div class="io-bars" id="io-bars"></div>
    <div class="bar-wrap">
      <div class="comp-head">
        <span class="eyebrow" id="comp-title">支出占比</span>
        <div class="view-toggle" id="view-toggle" role="tablist">
          <button data-view="bar" aria-selected="true" aria-label="横条视图" data-i18n-aria="viewBar">
            <svg viewBox="0 0 24 24"><path d="M6 20V12M12 20V6M18 20V14"/></svg>
          </button>
          <button data-view="ring" aria-selected="false" aria-label="圆环视图" data-i18n-aria="viewRing">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>
          </button>
          <button data-view="line" aria-selected="false" aria-label="趋势视图" data-i18n-aria="viewLine" id="btn-view-line" hidden>
            <svg viewBox="0 0 24 24"><path d="M4 16l5-6 4 4 7-9"/></svg>
          </button>
        </div>
      </div>
      <div id="comp-bar">
        <div class="bar" id="bar"></div>
        <div class="bar-ticks" id="bar-ticks"></div>
      </div>
      <div id="comp-ring" hidden>
        <div class="ring-box">
          <svg viewBox="0 0 120 120" id="ring-svg"></svg>
          <div class="ring-center" id="ring-center"></div>
        </div>
      </div>
      <div id="comp-line" hidden>
        <div class="trend-box">
          <svg viewBox="0 0 300 130" id="trend-svg"></svg>
        </div>
        <div class="trend-legend">
          <span><i style="background:var(--stamp)"></i><span data-i18n="legendExpense">支出</span></span>
          <span><i style="background:var(--moss)"></i><span data-i18n="legendIncome">收入</span></span>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="cats-section">
    <div class="section-head">
      <span class="eyebrow" data-i18n="catsSectionTitle">分类构成</span>
      <span class="eyebrow" id="cats-count"></span>
    </div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <span class="eyebrow" data-i18n="feedSectionTitle">流水明细</span>
    </div>
    <div id="feed"></div>
  </section>
</main>

<div class="dock">
  <button class="primary" id="btn-add" data-i18n="addBtn">记一笔</button>
</div>

<div class="scrim" id="scrim"></div>

<!-- 录入 -->
<div class="sheet" id="sheet-add" role="dialog" aria-label="记一笔">
  <div class="sheet-head">
    <h2 id="sheet-add-title">记一笔</h2>
    <button class="close" data-close data-i18n="closeBtn">关闭</button>
  </div>
  <div class="type-toggle" id="type-toggle" role="tablist">
    <button role="tab" data-type="expense" aria-selected="true" data-i18n="typeExpense">支出</button>
    <button role="tab" data-type="income" aria-selected="false" data-i18n="typeIncome">收入</button>
  </div>
  <div class="amount-display zero" id="amt-display"><span class="yen">¥</span><span id="amt-text">0</span></div>
  <div class="field cat-field">
    <label class="eyebrow" data-i18n="catFieldLabel">花在哪 · 分类</label>
    <div class="merchant-row">
      <button class="cat-pill" id="cat-pill" type="button"></button>
      <input type="text" id="in-merchant" placeholder="瑞幸 / 地铁 / 盒马…" data-i18n-placeholder="merchantPlaceholder" autocomplete="off" enterkeyhint="done">
    </div>
    <div class="cat-pop" id="cat-pop" hidden>
      <div class="chips" id="cat-chips"></div>
    </div>
  </div>
  <div class="field">
    <button class="time-toggle" id="time-toggle">
      <span class="eyebrow" data-i18n="timeLabel">时间</span><span id="time-preview">现在</span><span class="tt-go" data-i18n="timeChange">改</span>
    </button>
    <input type="datetime-local" id="in-time" hidden>
  </div>
  <div class="keypad" id="keypad"></div>
  <div class="save-wrap"><button class="save-btn" id="btn-save" disabled>记下</button></div>
</div>

<!-- 导入 -->
<div class="sheet" id="sheet-import" role="dialog" aria-label="导入账单">
  <div class="sheet-head">
    <h2 data-i18n="importTitle">导入账单</h2>
    <button class="close" data-close data-i18n="closeBtn">关闭</button>
  </div>
  <div class="drop" id="drop">
    <p data-i18n="dropText">把 CSV 拖进来，或选择文件</p>
    <small>
      <span data-i18n="dropHintAlipay">支付宝：我的 › 账单 › 右上角 › 开具交易流水证明 › 用于个人对账</span><br>
      <span data-i18n="dropHintWechat">微信：我 › 服务 › 钱包 › 账单 › 常见问题 › 下载账单 › 用于个人对账</span><br>
      <span data-i18n="dropHintEmail">账单会发到邮箱，解压后拿到 CSV</span>
    </small>
    <label class="file-btn" for="file-in" data-i18n="chooseFileBtn">选择文件</label>
    <input type="file" id="file-in" accept=".csv,.txt" multiple hidden>
  </div>
  <div class="log" id="import-log" hidden></div>
  <div style="height:calc(20px + var(--sab))"></div>
</div>

<!-- 待确认分类 -->
<div class="sheet" id="sheet-review" role="dialog" aria-label="待确认分类">
  <div class="sheet-head">
    <h2 data-i18n="reviewTitle">待确认分类</h2>
    <button class="close" data-close data-i18n="closeBtn">关闭</button>
  </div>
  <div id="review-body"></div>
  <div style="height:calc(20px + var(--sab))"></div>
</div>

<!-- 周报 / 月报小结 -->
<div class="sheet" id="sheet-reports" role="dialog" aria-label="周报与月报小结">
  <div class="sheet-head">
    <h2 data-i18n="reportsTitle">小结</h2>
    <button class="close" data-close data-i18n="closeBtn">关闭</button>
  </div>
  <div id="reports-body"></div>
  <div style="height:calc(20px + var(--sab))"></div>
</div>

<!-- 设置 -->
<div class="sheet" id="sheet-settings" role="dialog" aria-label="设置与备份" data-i18n-aria="settingsAria">
  <div class="sheet-head">
    <h2 data-i18n="settingsTitle">设置与备份</h2>
    <button class="close" data-close data-i18n="closeBtn">关闭</button>
  </div>
  <div class="row-block">
    <span data-i18n="themeSectionTitle">个性化界面</span>
    <div class="theme-row" id="theme-row"></div>
  </div>
  <div class="row-block">
    <span data-i18n="langSectionTitle">语言</span>
    <div class="theme-row" id="lang-row"></div>
  </div>
  <button class="row-btn" id="btn-import">
    <span><span data-i18n="importRowTitle">导入账单</span><small data-i18n="importRowDesc">支付宝 / 微信导出的 CSV 账单</small></span>
    <span class="go" data-i18n="importGo">导入</span>
  </button>
  <button class="row-btn" id="btn-export">
    <span><span data-i18n="exportRowTitle">导出全部数据</span><small data-i18n="exportRowDesc">下载 JSON 备份，含记录和分类记忆</small></span>
    <span class="go" data-i18n="exportGo">导出</span>
  </button>
  <label class="row-btn" for="file-restore" style="cursor:pointer">
    <span><span data-i18n="restoreRowTitle">恢复备份</span><small data-i18n="restoreRowDesc">选择之前导出的 JSON，合并进现有数据</small></span>
    <span class="go" data-i18n="restoreGo">选择</span>
  </label>
  <input type="file" id="file-restore" accept=".json" hidden>
  <div id="url-api-group">
    <button class="row-btn" id="btn-copy-url">
      <span><span data-i18n="apiRowTitle">自动写入接口</span><small data-i18n="apiRowDesc">给 iOS 快捷指令 / Android 通知监听调用</small></span>
      <span class="go" data-i18n="apiGo">复制</span>
    </button>
    <div class="code" id="api-code"></div>
  </div>
  <button class="row-btn" id="btn-notif-access" hidden>
    <span id="notif-access-label">通知监听权限<small>用于自动捕捉微信/支付宝付款通知</small></span>
    <span class="go" id="notif-access-go">去开启</span>
  </button>
  <button class="row-btn" id="btn-wipe" style="border-bottom:none">
    <span style="color:var(--stamp)"><span data-i18n="wipeRowTitle">清空所有数据</span><small data-i18n="wipeRowDesc">不可恢复，请先导出备份</small></span>
    <span class="go" data-i18n="wipeGo">清空</span>
  </button>
  <div class="log" style="border-top:1px solid var(--rule);margin-top:20px">
    <span id="storage-note"></span>
  </div>
  <div style="height:calc(20px + var(--sab))"></div>
</div>

<div class="toast" id="toast">
  <span class="t-amt" id="toast-amt"></span>
  <span class="t-txt" id="toast-txt"></span>
  <button class="t-undo" id="toast-undo" data-i18n="undoBtn">撤销</button>
</div>

<script>
"use strict";

/* ============================================================
   1. 分类体系
   ============================================================ */
const ICON_CUP = '<path d="M5 9h10v5a5 5 0 01-5 5 5 5 0 01-5-5V9z"/><path d="M15 10h1.5a1.8 1.8 0 010 3.5H15"/>';
const ICON_CAR = '<rect x="4" y="10" width="16" height="6" rx="2"/><circle cx="8" cy="18" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="18" r="1.5" fill="currentColor" stroke="none"/>';
const ICON_BAG = '<path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/>';
const ICON_BULB = '<circle cx="12" cy="10" r="5"/><path d="M9.5 18h5M10 20.5h4"/>';
const ICON_PLAY = '<circle cx="12" cy="12" r="8"/><path d="M10 9l5 3-5 3V9z"/>';
const ICON_HOUSE = '<path d="M4 12l8-7 8 7"/><path d="M6.5 11v8h11v-8"/>';
const ICON_WIFI = '<path d="M5 9a11 11 0 0114 0"/><path d="M8 12.5a6.5 6.5 0 018 0"/><circle cx="12" cy="17" r="1.3" fill="currentColor" stroke="none"/>';
const ICON_CROSS = '<circle cx="12" cy="12" r="8"/><path d="M12 8.5v7M8.5 12h7"/>';
const ICON_BOOK = '<path d="M3 6s3-1.5 9-1.5S21 6 21 6v12s-3-1.5-9-1.5-9 1.5-9 1.5V6z"/><path d="M12 4.5v13.5"/>';
const ICON_SWAP = '<path d="M4 8h13l-3-3M20 16H7l3 3"/>';
const ICON_DOTS = '<circle cx="7" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="12" r="1.4" fill="currentColor" stroke="none"/>';
const ICON_BRIEFCASE = '<rect x="4" y="9" width="16" height="10" rx="1.5"/><path d="M9 9V7a2 2 0 012-2h2a2 2 0 012 2v2"/>';
const ICON_CLOCK = '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>';
const ICON_TREND = '<path d="M4 16l5-5 4 4 7-8"/><path d="M15 7h5v5"/>';
const ICON_ENVELOPE = '<rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M3 7l9 6 9-6"/>';
const ICON_UNDO = '<path d="M8 8L4 12l4 4"/><path d="M4 12h11a5 5 0 010 10h-1"/>';

const CATS = [
  {k:'食',  n:'餐饮',  en:'Food',          c:'var(--c1)',  icon:ICON_CUP},
  {k:'行',  n:'交通',  en:'Transport',     c:'var(--c3)',  icon:ICON_CAR},
  {k:'购',  n:'购物',  en:'Shopping',      c:'var(--c4)',  icon:ICON_BAG},
  {k:'日',  n:'日用',  en:'Daily',         c:'var(--c6)',  icon:ICON_BULB},
  {k:'乐',  n:'娱乐',  en:'Entertainment', c:'var(--c5)',  icon:ICON_PLAY},
  {k:'住',  n:'居住',  en:'Housing',       c:'var(--c2)',  icon:ICON_HOUSE},
  {k:'讯',  n:'通信',  en:'Phone',         c:'var(--c10)', icon:ICON_WIFI},
  {k:'医',  n:'医疗',  en:'Medical',       c:'var(--c8)',  icon:ICON_CROSS},
  {k:'学',  n:'学习',  en:'Education',     c:'var(--c7)',  icon:ICON_BOOK},
  {k:'转',  n:'转账',  en:'Transfer',      c:'var(--c9)',  icon:ICON_SWAP},
  {k:'他',  n:'其他',  en:'Other',         c:'var(--c11)', icon:ICON_DOTS},
];
const INCOME_CATS = [
  {k:'薪', n:'工资',      en:'Salary',        c:'var(--i1)', icon:ICON_BRIEFCASE},
  {k:'兼', n:'兼职',      en:'Side Gig',      c:'var(--i2)', icon:ICON_CLOCK},
  {k:'财', n:'理财',      en:'Investment',    c:'var(--i3)', icon:ICON_TREND},
  {k:'红', n:'红包',      en:'Gift',          c:'var(--i4)', icon:ICON_ENVELOPE},
  {k:'退', n:'报销/退款', en:'Reimbursement', c:'var(--i5)', icon:ICON_UNDO},
  {k:'他', n:'其他收入',  en:'Other Income',  c:'var(--i6)', icon:ICON_DOTS},
];
const CAT_COLOR = {};
CATS.forEach(c=>CAT_COLOR[c.n]=c.c);
INCOME_CATS.forEach(c=>CAT_COLOR[c.n]=c.c);
const CAT_ICON = {};
CATS.forEach(c=>CAT_ICON[c.n]=c.icon);
INCOME_CATS.forEach(c=>CAT_ICON[c.n]=c.icon);
const CAT_EN = {};
CATS.forEach(c=>CAT_EN[c.n]=c.en);
INCOME_CATS.forEach(c=>CAT_EN[c.n]=c.en);
// 分类名只在显示时按语言转换，存储/匹配/记忆学习全部继续用中文名——
// 这样切换语言不用动数据、也不用动安卓那边的通知分类逻辑
function catLabel(catName){
  return (getLang()==='en' && CAT_EN[catName]) ? CAT_EN[catName] : catName;
}
// "未填写"/"自动记录"/"未知商户"（商户留空时的占位符）同理：存储永远用中文占位值，只在显示时翻译
function merchantLabel(m){
  if(getLang()!=='en') return m;
  if(m==='未填写') return t('notFilled');
  if(m==='自动记录') return t('autoRecordMerchant');
  if(m==='未知商户') return t('unknownMerchant');
  return m;
}
function seal(catName, extraClass){
  const color = CAT_COLOR[catName] || 'var(--c11)';
  const icon = CAT_ICON[catName] || ICON_DOTS;

   ============================================================ */
const KEY = 'moneymanager.v1';
const BRIDGE = typeof window.AndroidBridge !== 'undefined' ? window.AndroidBridge : null;
let memFallback = null;

function loadDB(){
  const blank = {tx:[], memory:{}, pref:{}, reports:[], v:1};
  try{
    const raw = BRIDGE ? BRIDGE.load() : localStorage.getItem(KEY);
    if(!raw) return blank;
    const d = JSON.parse(raw);
    return {tx:Array.isArray(d.tx)?d.tx:[], memory:d.memory||{}, pref:d.pref||{}, reports:Array.isArray(d.reports)?d.reports:[], v:1};
  }catch(e){
    if(memFallback) return memFallback;
    return blank;
  }
}
function saveDB(){
  try{
    const json = JSON.stringify(DB);
    if(BRIDGE) BRIDGE.save(json);
    else localStorage.setItem(KEY, json);
    return true;
  }catch(e){
    memFallback = DB;
    return false;
  }
}
let DB = loadDB();
let storageOK = (function(){
  if(BRIDGE) return true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; }
})();

// 折线图：周视图看最近4周，月视图看最近3个月，跟着当前翻页的周期走
function getTrendPeriods(){
  if(period === 'week'){
    const periods = [];
    for(let i=3;i>=0;i--){
      const s = startOfWeek(new Date()); s.setDate(s.getDate() + (offset-i)*7);
      const e = new Date(s); e.setDate(e.getDate()+7);
      periods.push({from:s, to:e, label:(s.getMonth()+1)+'/'+s.getDate()});
    }
    return periods;
  }
  if(period === 'month'){
    const periods = [];
    const now = new Date();
    for(let i=2;i>=0;i--){
      const s = new Date(now.getFullYear(), now.getMonth()+offset-i, 1);
      const e = new Date(now.getFullYear(), now.getMonth()+offset-i+1, 1);
      periods.push({from:s, to:e, label: getLang()==='en' ? MONTHS_EN[s.getMonth()] : (s.getMonth()+1)+'月'});
    }
    return periods;
  }
  return null;
}
function renderTrend(){
  const periods = getTrendPeriods();
  if(!periods) return;
  const data = periods.map(p=>{
    const agg = rangeAgg(p.from, p.to);
    return {label:p.label, expense:agg.total, income:agg.incomeTotal};
  });
  const maxVal = Math.max(1, ...data.map(d=>Math.max(d.expense, d.income)));

  const W=300, H=130, padL=8, padR=8, padT=14, padB=22;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = data.length;
  const stepX = n>1 ? plotW/(n-1) : 0;
  const xy = (i,val) => [padL+stepX*i, padT+plotH-(val/maxVal)*plotH];

  const expensePts = data.map((d,i)=>xy(i,d.expense));
  const incomePts = data.map((d,i)=>xy(i,d.income));
  const toPath = pts => pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = (pts,color) => pts.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${color}"/>`).join('');

  const gridLine = `<line x1="${padL}" y1="${(padT+plotH).toFixed(1)}" x2="${(padL+plotW).toFixed(1)}" y2="${(padT+plotH).toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>`;
  const expensePath = `<path d="${toPath(expensePts)}" fill="none" stroke="var(--stamp)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  const incomePath = `<path d="${toPath(incomePts)}" fill="none" stroke="var(--moss)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  const labels = data.map((d,i)=>{
    const [x] = xy(i,0);
    return `<text x="${x.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-35)">${esc(d.label)}</text>`;
  }).join('');

  $('trend-svg').innerHTML = gridLine + expensePath + incomePath + dots(expensePts,'var(--stamp)') + dots(incomePts,'var(--moss)') + labels;
}

/* ============================================================
   3. 自动分类引擎
   ============================================================ */
function normalize(s){
  return String(s||'').toLowerCase().replace(/\s+/g,'').replace(/[（）()【】\[\]·、,，.。"'"'-]/g,'');
}
function classify(merchant, note, rawCat, type){
  return classifyC(merchant, note, rawCat, type).cat;
}
// 带置信度的分类：confident=false 表示纯靠兜底猜的，值得向用户确认
function classifyC(merchant, note, rawCat, type){
  return type === 'income' ? classifyIncome(merchant, note, rawCat) : classifyExpense(merchant, note, rawCat);
}
function classifyExpense(merchant, note, rawCat){
  const hay = normalize(merchant + ' ' + (note||'') + ' ' + (rawCat||''));
  if(!hay) return {cat:'其他', confident:false};

  // 3.1 学过的商户，优先
  const memKey = normalize(merchant);
  if(memKey && DB.memory[memKey]) return {cat:DB.memory[memKey], confident:true};

  // 3.2 平台自带分类（支付宝新版账单有「交易分类」列，很准）
  if(rawCat){
    const rc = String(rawCat);
    for(const c of CATS){ if(rc.includes(c.n)) return {cat:c.n, confident:true}; }
    const map = {'餐饮美食':'餐饮','食品':'餐饮','交通出行':'交通','服饰':'购物','日用百货':'日用',
                 '文化休闲':'娱乐','运动户外':'娱乐','家居':'日用','充值缴费':'通信','医疗健康':'医疗',
                 'education':'学习','亲友代付':'转账','转账红包':'转账','商业服务':'其他','数码电器':'购物',
                 '住房物业':'居住','美容美发':'日用','爱车养车':'交通','酒店旅游':'娱乐','投资理财':'转账',
                 '公共服务':'其他','保险':'其他','母婴亲子':'日用','宠物':'日用'};
    for(const k in map){ if(rc.includes(k)) return {cat:map[k], confident:true}; }
  }

  // 3.3 关键词命中，取最长匹配（更具体的词优先）
  let best = null, bestLen = 0;
  for(const cat in RULES){
    for(const kw of RULES[cat]){
      const nk = normalize(kw);
      if(nk && hay.includes(nk) && nk.length > bestLen){ best = cat; bestLen = nk.length; }
    }
  }
  if(best) return {cat:best, confident:true};
  return {cat:'其他', confident:false};
}
function classifyIncome(merchant, note, rawCat){
  const hay = normalize(merchant + ' ' + (note||'') + ' ' + (rawCat||''));
  if(!hay) return {cat:'其他收入', confident:false};

  const memKey = normalize(merchant);
  if(memKey && DB.memory[memKey+'::in']) return {cat:DB.memory[memKey+'::in'], confident:true};

  let best = null, bestLen = 0;
  for(const cat in INCOME_RULES){
    for(const kw of INCOME_RULES[cat]){
      const nk = normalize(kw);
      if(nk && hay.includes(nk) && nk.length > bestLen){ best = cat; bestLen = nk.length; }
    }
  }
  if(best) return {cat:best, confident:true};
  return {cat:'其他收入', confident:false};
}
function remember(merchant, cat, type){
  const k = normalize(merchant);
  if(!k || !cat) return;
  if(type === 'income') DB.memory[k+'::in'] = cat;
  else DB.memory[k] = cat;
}

/* ============================================================
   4. 工具
   ============================================================ */
const pad2 = n => String(n).padStart(2,'0');
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function money(n){
  const v = Math.abs(Number(n)||0);
  return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function localISO(d){
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function startOfWeek(d){ // 周一为一周之始
  const x = new Date(d); x.setHours(0,0,0,0);
  const dow = (x.getDay()+6)%7;
  x.setDate(x.getDate()-dow);
  return x;
}
function fingerprint(t){
  if(t.orderNo) return 'o:'+t.orderNo;
  return 'f:'+ (t.type==='income'?'in':'ex') + '|' + (t.time||'').slice(0,16) + '|' + Number(t.amount).toFixed(2) + '|' + normalize(t.merchant).slice(0,14);
}

/* ============================================================
   5. 写入
   ============================================================ */
function addTx(t, opts){
  opts = opts||{};
  const type = t.type === 'income' ? 'income' : 'expense';
  let category = t.category;
  let needsReview = false;
  if(!category){
    const guess = classifyC(t.merchant, t.note, t.rawCat, type);
    category = guess.cat;
    // 只对自动来源（导入 / 自动写入）的低置信度猜测排队确认，手动记账当场就选好了分类
    needsReview = !guess.confident && t.source !== 'manual';
  }
  const rec = {
    id: uid(),
    amount: Math.abs(Number(t.amount)||0),
    merchant: (t.merchant||'未填写').trim().slice(0,60),
    type: type,
    category: category,
    needsReview: needsReview,
    time: t.time || localISO(new Date()),
    source: t.source || 'manual',
    orderNo: t.orderNo || '',
    note: t.note || ''
  };
  if(rec.amount <= 0) return null;
  rec.fp = fingerprint(rec);
  if(DB.tx.some(x => x.fp === rec.fp)) return null;  // 去重
  DB.tx.push(rec);
  if(opts.learn && t.merchant && t.category) remember(t.merchant, t.category, type);
  if(!opts.silent){ saveDB(); render(); }
  return rec;
}
function delTx(id){
  const i = DB.tx.findIndex(x=>x.id===id);
  if(i<0) return;
  DB.tx.splice(i,1);
  saveDB(); render();
}
function updateTx(id, patch){
  const rec = DB.tx.find(x=>x.id===id);
  if(!rec) return null;
  Object.assign(rec, patch);
  rec.amount = Math.abs(Number(rec.amount)||0);
  rec.merchant = (rec.merchant||'未填写').trim().slice(0,60);
  if(rec.amount <= 0) return null;
  rec.fp = fingerprint(rec);
  if(DB.tx.some(x => x.id !== id && x.fp === rec.fp)) return null;  // 去重（排除自己）
  saveDB(); render();
  return rec;
}

/* ============================================================
   6. 周期与汇总
   ============================================================ */
let period = 'week';
let offset = 0;   // 0 = 本期，-1 = 上一期

function getRange(){
  const now = new Date();
  if(period === 'all'){
    return {from:new Date(0), to:new Date(3e12), label:t('allRecords'), days:null};
  }
  if(period === 'day'){
    const s = new Date(now); s.setHours(0,0,0,0); s.setDate(s.getDate() + offset);
    const e = new Date(s); e.setDate(e.getDate()+1);
    const wd = t('weekdays')[s.getDay()];
    const label = monthDayLabel(s)+' · '+wd;
    return {from:s, to:e, label, days:1};
  }
  if(period === 'week'){
    const s = startOfWeek(now); s.setDate(s.getDate() + offset*7);
    const e = new Date(s); e.setDate(e.getDate()+7);
    const eShow = new Date(e); eShow.setDate(eShow.getDate()-1);
    const sameMonth = s.getMonth()===eShow.getMonth();
    const label = getLang()==='en'
      ? monthDayLabel(s) + ' – ' + (sameMonth ? eShow.getDate() : monthDayLabel(eShow))
      : (s.getMonth()+1)+'月'+s.getDate()+'日 – ' + (sameMonth?'':(eShow.getMonth()+1)+'月') + eShow.getDate()+'日';
    return {from:s, to:e, label, days:7};
  }
  const s = new Date(now.getFullYear(), now.getMonth()+offset, 1);
  const e = new Date(now.getFullYear(), now.getMonth()+offset+1, 1);
  const days = Math.round((e-s)/864e5);
  const label = getLang()==='en' ? MONTHS_EN[s.getMonth()]+' '+s.getFullYear() : s.getFullYear()+'年'+(s.getMonth()+1)+'月';
  return {from:s, to:e, label, days};
}
function inRange(t, r){
  const d = new Date(t.time);
  return d >= r.from && d < r.to;
}

    }).join('');
    attachSwipeHandlers();
  }

  updateReviewBadge();

let lastOpenSwipe = null;
const autoClosingSwipes = new WeakSet();
function attachSwipeHandlers(){
  document.querySelectorAll('.tx-swipe').forEach(el=>{
    el.addEventListener('scroll', ()=>{
      if(autoClosingSwipes.has(el)){
        if(el.scrollLeft <= 20) autoClosingSwipes.delete(el);
        return;
      }
      if(el.scrollLeft > 20){
        if(lastOpenSwipe && lastOpenSwipe!==el){
          autoClosingSwipes.add(lastOpenSwipe);
          lastOpenSwipe.scrollTo({left:0, behavior:'smooth'});
        }
        lastOpenSwipe = el;
      } else if(lastOpenSwipe===el){
        lastOpenSwipe = null;
      }
    }, {passive:true});
  });
}

// 圆环视图：跟横条用的是同一份 rows 数据，只是画法不同
function renderRing(rows, total){
  const R = 50, CX = 60, CY = 60, SW = 14;
  const circ = 2 * Math.PI * R;
  const track = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--paper-2)" stroke-width="${SW}"/>`;
  let segs = '';
  if(total > 0){
    let cursor = 0;
    segs = rows.map(([c,v])=>{
      const dash = v/total*circ;
      const html = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${CAT_COLOR[c]||'var(--c11)'}" stroke-width="${SW}"
        stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-cursor).toFixed(2)}"
        transform="rotate(-90 ${CX} ${CY})"><title>${esc(catLabel(c))} ${(v/total*100).toFixed(0)}%</title></circle>`;
      cursor += dash;
      return html;
    }).join('');
  }
  $('ring-svg').innerHTML = track + segs;
  if(total > 0){
    const top = rows[0];
    $('ring-center').innerHTML = `<b>${(top[1]/total*100).toFixed(0)}%</b><span>${esc(catLabel(top[0]))}</span>`;
  } else {
    $('ring-center').innerHTML = `<b>—</b><span>${t('noDataYet')}</span>`;
  }
}

function esc(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// 给一段任意时间范围算支出/收入/分类汇总——实时小结和存档周报/月报共用
function rangeAgg(from, to){
  const list = DB.tx.filter(t => t.type !== 'income' && new Date(t.time) >= from && new Date(t.time) < to);
  const incomeList = DB.tx.filter(t => t.type === 'income' && new Date(t.time) >= from && new Date(t.time) < to);
  const total = list.reduce((s,t)=>s+t.amount, 0);
  const incomeTotal = incomeList.reduce((s,t)=>s+t.amount, 0);
  const agg = {};
  list.forEach(t => agg[t.category] = (agg[t.category]||0) + t.amount);
  const rows = Object.entries(agg).sort((a,b)=>b[1]-a[1]);
  return {total, incomeTotal, rows};
}

// 人话小结：本期花了多少、大头是什么、跟上一期比怎么样
function composeReportText(total, incomeTotal, rows, prevExpense){
  if(total <= 0 && incomeTotal <= 0) return '';
  if(getLang()==='en') return composeReportTextEN(total, incomeTotal, rows, prevExpense);
  const parts = [];
  parts.push(total>0
    ? `这段时间一共花了 ¥${money(total)}${incomeTotal>0?`，收入 ¥${money(incomeTotal)}`:''}`
    : `这段时间没有支出${incomeTotal>0?`，收入 ¥${money(incomeTotal)}`:''}`);

  if(rows.length && total>0){
    const top = rows[0];
    parts.push(`大头是「${top[0]}」，¥${money(top[1])}（占${(top[1]/total*100).toFixed(0)}%）`);
  }

  if(prevExpense > 0 && total > 0){
    const diff = total - prevExpense;
    if(Math.abs(diff) >= 0.01){
      parts.push(diff>0 ? `比上一期多花了 ¥${money(Math.abs(diff))}` : `比上一期少花了 ¥${money(Math.abs(diff))}`);
    } else {
      parts.push('跟上一期基本持平');
    }
  }

  if(incomeTotal > 0){
    const balance = incomeTotal - total;
    parts.push(balance>=0 ? `结余 +¥${money(balance)}` : `倒贴了 ¥${money(Math.abs(balance))}`);
  }
  return parts.join('，') + '。';
}
function composeReportTextEN(total, incomeTotal, rows, prevExpense){
  const parts = [];
  parts.push(total>0
    ? `You spent a total of ¥${money(total)} this period${incomeTotal>0?`, with ¥${money(incomeTotal)} in income`:''}`
    : `No spending this period${incomeTotal>0?`, with ¥${money(incomeTotal)} in income`:''}`);

  if(rows.length && total>0){
    const top = rows[0];
    parts.push(`the biggest category was "${catLabel(top[0])}" at ¥${money(top[1])} (${(top[1]/total*100).toFixed(0)}% of total)`);
  }

  if(prevExpense > 0 && total > 0){
    const diff = total - prevExpense;
    if(Math.abs(diff) >= 0.01){
      parts.push(diff>0 ? `¥${money(Math.abs(diff))} more than last period` : `¥${money(Math.abs(diff))} less than last period`);
    } else {
      parts.push('about the same as last period');
    }
  }

  if(incomeTotal > 0){
    const balance = incomeTotal - total;
    parts.push(balance>=0 ? `balance +¥${money(balance)}` : `¥${money(Math.abs(balance))} in the red`);
  }
  return parts.join(', ') + '.';
}

/* ============================================================
   7b. 周报 / 月报存档 —— 铃铛里看的那些
   ============================================================ */
function generateStoredReport(type, from, to, prevFrom, prevTo, periodLabel){
  const {total, incomeTotal, rows} = rangeAgg(from, to);
  const prevExpense = rangeAgg(prevFrom, prevTo).total;
  const text = composeReportText(total, incomeTotal, rows, prevExpense);
  if(!text) return null;
  return {
    id: uid(),
    type,
    periodLabel,
    text,
    read: false,
    createdAt: localISO(new Date())
  };
}
function checkAutoReports(){
  DB.pref = DB.pref || {};
  DB.reports = DB.reports || [];
  let changed = false;

  // 上一周有没有生成过
  const thisWeekStart = startOfWeek(new Date());
  const lastWeekStart = new Date(thisWeekStart); lastWeekStart.setDate(lastWeekStart.getDate()-7);
  const lastWeekEnd = thisWeekStart;
  const lastWeekKey = localISO(lastWeekStart).slice(0,10);
  if(DB.pref.reportedWeekKey !== lastWeekKey){
    const prevWeekStart = new Date(lastWeekStart); prevWeekStart.setDate(prevWeekStart.getDate()-7);
    const eShow = new Date(lastWeekEnd); eShow.setDate(eShow.getDate()-1);
    const sameMonth = lastWeekStart.getMonth()===eShow.getMonth();
    const label = getLang()==='en'
      ? monthDayLabel(lastWeekStart) + ' – ' + (sameMonth ? eShow.getDate() : monthDayLabel(eShow))
      : (lastWeekStart.getMonth()+1)+'月'+lastWeekStart.getDate()+'日 – ' + (sameMonth?'':(eShow.getMonth()+1)+'月') + eShow.getDate()+'日';
    const rec = generateStoredReport('week', lastWeekStart, lastWeekEnd, prevWeekStart, lastWeekStart, label);
    if(rec) DB.reports.push(rec);
    DB.pref.reportedWeekKey = lastWeekKey;
    changed = true;
  }

  // 上个月有没有生成过
  const now = new Date();
  const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const lastMonthStart = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastMonthEnd = thisMonthStart;
  const lastMonthKey = lastMonthStart.getFullYear()+'-'+pad2(lastMonthStart.getMonth()+1);
  if(DB.pref.reportedMonthKey !== lastMonthKey){
    const prevMonthStart = new Date(now.getFullYear(), now.getMonth()-2, 1);
    const label = getLang()==='en'
      ? MONTHS_EN[lastMonthStart.getMonth()]+' '+lastMonthStart.getFullYear()
      : lastMonthStart.getFullYear()+'年'+(lastMonthStart.getMonth()+1)+'月';
    const rec = generateStoredReport('month', lastMonthStart, lastMonthEnd, prevMonthStart, lastMonthStart, label);
    if(rec) DB.reports.push(rec);
    DB.pref.reportedMonthKey = lastMonthKey;
    changed = true;
  }

  if(changed) saveDB();
}

/* ============================================================
   10. CSV 解析（支付宝 / 微信）
   ============================================================ */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q = false; }
      else cell += ch;
    } else {
      if(ch === '"') q = true;
      else if(ch === ','){ row.push(cell); cell=''; }
      else if(ch === '\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else if(ch === '\r'){ /* skip */ }
      else cell += ch;
    }
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function decodeFile(file){
  const buf = await file.arrayBuffer();
  // 先试 UTF-8，乱码则退回 GBK（支付宝/微信导出常见 GBK）
  let s = new TextDecoder('utf-8').decode(buf);
  const bad = (s.match(/\uFFFD/g)||[]).length;
  if(bad > 3){
    try{ s = new TextDecoder('gbk').decode(buf); }
    catch(e){ try{ s = new TextDecoder('gb18030').decode(buf); }catch(e2){} }
  }
  return s.replace(/^\uFEFF/,'');
}
function findHeader(rows){
  for(let i=0;i<Math.min(rows.length, 40);i++){
    const joined = rows[i].join('|');
    if(/交易时间|交易创建时间|付款时间/.test(joined) && /金额/.test(joined)) return i;
  }
  return -1;
}
function colIndex(header, patterns){
  for(const p of patterns){
    for(let i=0;i<header.length;i++){
      if(String(header[i]).replace(/\s/g,'').includes(p)) return i;
    }
  }
  return -1;
}
function parseAmount(s){
  const m = String(s).replace(/[,\s¥￥元]/g,'').match(/-?\d+(\.\d+)?/);
  return m ? Math.abs(parseFloat(m[0])) : NaN;
}
function parseTime(s){
  let t = String(s).trim().replace(/\//g,'-');
  const m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T]?(\d{1,2})?:?(\d{2})?/);
  if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3], +(m[4]||12), +(m[5]||0));
  if(isNaN(d)) return null;
  return localISO(d);
}

async function importFile(file){
  const text = await decodeFile(file);
  const rows = parseCSV(text);
  const hi = findHeader(rows);
  if(hi < 0) return {file:file.name, err:t('importNoHeader')};

  const H = rows[hi].map(x=>String(x).trim());
  const iTime  = colIndex(H, ['交易时间','付款时间','交易创建时间']);
  const iAmt   = colIndex(H, ['金额']);
  const iIO    = colIndex(H, ['收/支','收支']);
  const iParty = colIndex(H, ['交易对方','对方']);
  const iGoods = colIndex(H, ['商品说明','商品','商品名称']);
  const iCat   = colIndex(H, ['交易分类','类型','交易类型']);
  const iState = colIndex(H, ['交易状态','当前状态']);
  const iNo    = colIndex(H, ['交易订单号','交易单号','交易号']);
  const iNote  = colIndex(H, ['备注']);

  if(iTime<0 || iAmt<0) return {file:file.name, err:t('importMissingCols')};

  let added=0, dup=0, skip=0;
  for(let r=hi+1; r<rows.length; r++){
    const row = rows[r];
    if(!row || row.length < 3) continue;
    const cell = i => (i>=0 && i<row.length) ? String(row[i]).trim() : '';

    // 支出 / 收入都收，其余（不计收支等）跳过
    const io = cell(iIO);
    let txType = 'expense';
    if(io){
      if(/^不计/.test(io) || /不计收支/.test(io)){ skip++; continue; }
      if(/收/.test(io) && !/支/.test(io)) txType = 'income';
      else if(/支/.test(io)) txType = 'expense';
      else { skip++; continue; }
    }
    const state = cell(iState);
    if(/关闭|失败|退款成功|已退款|已全额退款|不计收支/.test(state)){ skip++; continue; }

    const amount = parseAmount(cell(iAmt));
    const time = parseTime(cell(iTime));
    if(!time || !isFinite(amount) || amount<=0){ skip++; continue; }

    const party = cell(iParty);
    const goods = cell(iGoods);
    const merchant = party || goods || '未知商户';
    const rawCat = cell(iCat);

    // 淘宝/微信这种大平台，商品说明比对方名更有信息量
    let display = merchant;
    if(TAOBAO_LIKE.some(k=>merchant.includes(k)) && goods && goods.length>1){
      display = goods.slice(0,40);
    }
    const rec = addTx({
      amount, merchant: display, time,
      note: goods && goods!==display ? goods : cell(iNote),
      rawCat, orderNo: cell(iNo), source:'import', type: txType
    }, {silent:true});
    if(rec) added++; else dup++;
  }
  return {file:file.name, added, dup, skip};
}

/* ============================================================
   11. URL 自动写入接口
   给 iOS 快捷指令 / Android 通知监听调用
   ============================================================ */
function parseFromText(text){
  const t = String(text);
  // 金额：优先 ¥ 后面的数字，其次「金额」附近，最后任意小数
  let amount = NaN;
  let m = t.match(/[¥￥]\s*(\d+(?:\.\d{1,2})?)/);
  if(!m) m = t.match(/(?:金额|付款|支付|消费|扣款|支出)[^\d]{0,6}(\d+(?:\.\d{1,2})?)/);
  if(!m) m = t.match(/(\d+\.\d{2})\s*元?/);
  if(!m) m = t.match(/(\d+)\s*元/);
  if(m) amount = parseFloat(m[1]);

  // 商户：常见通知句式
  let merchant = '';
  const pats = [
    /(?:向|在|于)\s*([^\s,，。；;]{2,24}?)\s*(?:付款|消费|支付|转账)/,
    /(?:商户|收款方|对方|付款给)[：:]\s*([^\s,，。；;]{2,24})/,
    /([^\s,，。；;]{2,24}?)(?:交易成功|付款成功|支付成功)/,
    /(?:来自|收到)\s*([^\s,，。；;]{2,24}?)\s*(?:的转账|的红包|付款)/,
  ];
  for(const p of pats){ const r = t.match(p); if(r){ merchant = r[1].trim(); break; } }

  // 收/支方向：默认支出，命中收款类措辞才判为收入
  let type = 'expense';
  if(/收款|到账|入账|已存入|工资入账|收到.{0,10}(转账|红包)/.test(t) && !/付款|消费|支付成功|扣款|支出/.test(t)){
    type = 'income';
  }
  return {amount, merchant, type};
}
function handleURLIntake(){
  const q = new URLSearchParams(location.search || (location.hash.includes('?') ? location.hash.slice(location.hash.indexOf('?')) : ''));
  if(![...q.keys()].length) return;

  let amount = parseFloat(q.get('amount') || q.get('a') || '');
  let merchant = q.get('merchant') || q.get('m') || '';
  let type = q.get('type') || q.get('ty') || '';
  const rawText = q.get('text') || q.get('t') || '';

  if(rawText){
    const p = parseFromText(rawText);
    if(!isFinite(amount)) amount = p.amount;
    if(!merchant) merchant = p.merchant;
    if(!type && p.type) type = p.type;
  }
  // 清掉 URL，避免刷新重复写入
  try{ history.replaceState(null,'',location.pathname); }catch(e){}

  if(!isFinite(amount) || amount<=0){
    if(rawText || q.has('amount')) toast(null, t('toastNoAmount'));
    return;
  }
  const rec = addTx({
    amount,
    merchant: merchant || '自动记录',
    category: q.get('cat') || q.get('c') || undefined,
    time: q.get('time') ? (parseTime(q.get('time')) || undefined) : undefined,
    source: 'auto',
    type: type === 'income' ? 'income' : 'expense',
    note: rawText.slice(0,120)
  });
  if(rec) toast(rec, rec.type==='income' ? t('toastAutoIncome') : t('toastAutoExpense'));
  else toast(null, t('toastDup'));
}

  lastRec = rec;

  $('toast-txt').textContent = rec ? (msg + ' · ' + merchantLabel(rec.merchant) + ' · ' + catLabel(rec.category)) : msg;

}
$('toast-undo').onclick = ()=>{
  if(lastRec) delTx(lastRec.id);
  $('toast').classList.remove('on');
};

/* ============================================================
   13. 交互绑定
   ============================================================ */
document.querySelectorAll('[data-period]').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('[data-period]').forEach(x=> x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
    period = b.dataset.period; offset = 0; render();
  };
});
$('nav-prev').onclick = ()=>{ offset--; render(); };
$('nav-next').onclick = ()=>{ if(offset<0){ offset++; render(); } };
document.querySelectorAll('#view-toggle [data-view]').forEach(b=>{
  b.onclick = ()=>{ setCompView(b.dataset.view); };
});
document.addEventListener('click', e=>{
  const ed = e.target.closest('[data-edit]');
  if(ed){ openEditSheet(ed.dataset.edit); return; }
  const d = e.target.closest('[data-del]');
  if(d) delTx(d.dataset.del);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && openSheet) sheetClose(); });

/* 小结铃铛 */
$('btn-reports').onclick = ()=>{
  (DB.reports||[]).forEach(r=> r.read = true);
  saveDB();
  updateReportsBadge();
  renderReports();
  sheetOpen('sheet-reports');
};

/* 设置 */
function refreshSettingsPanel(){
  if(BRIDGE){
    $('url-api-group').hidden = true;
    $('btn-notif-access').hidden = false;
    const granted = BRIDGE.isNotificationAccessGranted && BRIDGE.isNotificationAccessGranted();
    $('notif-access-label').innerHTML = granted
      ? `${t('notifAccessOnLabel')}<small>${t('notifAccessOnDesc')}</small>`
      : `${t('notifAccessOffLabel')}<small>${t('notifAccessOffDesc')}</small>`;
    $('notif-access-go').textContent = granted ? t('notifAccessRecheck') : t('notifAccessGo');
    $('storage-note').textContent = t('storageNoteBridge');
  } else {
    const base = location.origin + location.pathname;
    const isEn = getLang()==='en';
    $('api-code').innerHTML =
      esc(base) + `?<b>amount</b>=18.5&<b>merchant</b>=${isEn?'Starbucks':'瑞幸'}<br><br>` +
      t('apiCodeIncomeHint') + '<br>' +
      esc(base) + `?<b>amount</b>=8000&<b>merchant</b>=${isEn?'Salary':'工资'}&<b>type</b>=income<br><br>` +
      t('apiCodeTextHint') + '<br>' +
      esc(base) + `?<b>text</b>=${isEn?'WeChat Pay - paid Starbucks 18.50':'微信支付-向瑞幸咖啡付款18.50元'}`;
    $('storage-note').textContent = storageOK
      ? t('storageNoteWebOK')
      : t('storageNoteWebBad');
  }
}
$('btn-settings').onclick = ()=>{
  refreshSettingsPanel();
  sheetOpen('sheet-settings');
};
$('btn-notif-access').onclick = ()=>{
  if(BRIDGE && BRIDGE.openNotificationSettings) BRIDGE.openNotificationSettings();
};
$('btn-export').onclick = ()=>{
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'moneymanager-' + localISO(new Date()).slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
};
$('file-restore').onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    let n = 0;
    (d.tx||[]).forEach(t=>{
      t.fp = t.fp || fingerprint(t);
      if(!DB.tx.some(x=>x.fp===t.fp)){ t.id = t.id||uid(); DB.tx.push(t); n++; }
    });
    Object.assign(DB.memory, d.memory||{});
    saveDB(); render(); sheetClose();
    toast(null, t('toastMerged', n));
  }catch(err){ toast(null, t('toastRestoreFail')); }
  e.target.value='';
};
$('btn-copy-url').onclick = async ()=>{
  const url = location.origin + location.pathname + '?amount=&merchant=';
  try{ await navigator.clipboard.writeText(url); toast(null, t('toastUrlCopied')); }
  catch(e){ toast(null, t('toastCopyFail')); }
};
$('btn-wipe').onclick = ()=>{
  if(!confirm(t('confirmWipe'))) return;
  DB = {tx:[], memory:{}, pref:{}, reports:[], v:1};
  saveDB(); render(); sheetClose();
  updateReportsBadge();
  toast(null, t('toastWiped'));
};

/* ============================================================
   14. 启动
   ============================================================ */
$('in-time').value = localISO(new Date());
checkAutoReports();
updateReportsBadge();
renderLangRow();
applyLang();
handleURLIntake();
</script>
</body>
</html>
